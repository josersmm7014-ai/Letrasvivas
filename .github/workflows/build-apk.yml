name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY_DISABLED: true

    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP_FILE" || { echo "No se encontró el ZIP"; exit 1; }
          rm -rf app
          mkdir app
          unzip -q "$ZIP_FILE" -d app
          test -f app/package.json
          test -f app/ci.sh
          echo "Proyecto listo en app/"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: app/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compilar proyecto
        run: bash app/ci.sh

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LetrasEnVivo-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
