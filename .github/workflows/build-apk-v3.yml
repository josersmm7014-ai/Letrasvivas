name: Build APK v3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY_DISABLED: true

    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir únicamente la versión v2
        run: |
          set -e
          test -f LetrasEnVivo-traduccion-v3.zip || {
            echo "Falta LetrasEnVivo-traduccion-v3.zip en la raíz del repositorio"
            exit 1
          }
          rm -rf app
          mkdir app
          unzip -q LetrasEnVivo-traduccion-v3.zip -d app
          test -f app/package.json
          test -f app/ci.sh
          grep -q LocalTranslate app/src/bridge.js
          grep -q LocalTranslatePlugin app/native/MainActivity.java
          test -f app/native/LocalTranslatePlugin.java
          echo "ZIP v3 verificado correctamente"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: app/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" >/dev/null || true

      - name: Compilar APK v3
        run: bash app/ci.sh

      - name: Subir APK v3
        uses: actions/upload-artifact@v4
        with:
          name: LetrasEnVivo-apk-v3
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
